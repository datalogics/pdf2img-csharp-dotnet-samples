name: test-nuget-package-with-samples

on:
    pull_request:
    push:
        branches: [ develop ]

env:
    DOTNET_VERSION: '8.x'

jobs:
    build-and-run-samples:
        runs-on: windows-2022
        strategy:
          matrix: { dir: ['ConvertToJpg'] }
        steps:
            - name: Checkout
              uses: actions/checkout@v3
            - name: Setup .NET
              uses: actions/setup-dotnet@v3
              with:
                dotnet-version: ${{ env.DOTNET_VERSION }}
            - name: Build samples
              working-directory: ${{ matrix.dir }}
              run: dotnet build --configuration Release
            - name: Check for activation key
              id: key
              env:
                ACTIVATION_KEY: ${{ secrets.PDF2IMG_ACTIVATION_KEY }}
              run: |
                if ($env:ACTIVATION_KEY) { $present = "true" } else { $present = "false" }
                "present=$present" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            - name: Run samples
              if: steps.key.outputs.present == 'true'
              working-directory: ${{ matrix.dir }}
              env:
                ACTIVATION_KEY: ${{ secrets.PDF2IMG_ACTIVATION_KEY }}
              run: $env:ACTIVATION_KEY | dotnet run --configuration Release
            - name: List files
              run: |
                ls ${{matrix.dir}}
            - name: Save artifacts
              uses: actions/upload-artifact@v4
              with:
                name: sample-output
                path: |
                  ${{matrix.dir}}\*.jpg
                  ${{matrix.dir}}\*.jpeg
                  ${{matrix.dir}}\*.eps
                  ${{matrix.dir}}\*.tiff
                  ${{matrix.dir}}\*.tif
                  ${{matrix.dir}}\*.bmp
                  ${{matrix.dir}}\*.png
                  ${{matrix.dir}}\*.raw
                  ${{matrix.dir}}\*.pdf
                  ${{matrix.dir}}\*.gif
